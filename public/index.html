<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Face Off</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23111'/%3E%3Ctext x='50' y='70' font-size='64' text-anchor='middle' fill='%23d4af37'%3E%E2%99%A3%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- LANDING -->
  <section id="screen-landing" class="screen">
    <h1>Face&nbsp;Off<span class="suit-deco">&#9827;</span></h1>

    <div class="panel">
      <label>Your name
        <input id="name-input" type="text" maxlength="20" placeholder="Player" />
      </label>

      <div class="landing-actions">
        <button id="btn-create" class="primary">Create Room</button>
        <div class="divider">or</div>
        <label>Room code
          <input id="join-code-input" type="text" maxlength="4" placeholder="ABCD" autocapitalize="characters" />
        </label>
        <button id="btn-join">Join Room</button>
      </div>
      <p id="landing-error" class="error"></p>
    </div>
  </section>

  <!-- LOBBY: waiting for a friend, then game setup (mode + target) -->
  <section id="screen-waiting" class="screen hidden">
    <h2 id="lobby-title">Waiting for your friend&hellip;</h2>
    <div id="lobby-code-block">
      <p>Share this room code:</p>
      <div id="room-code-display" class="room-code"></div>
      <p class="hint">They enter this code on the Face Off home screen to join.</p>
    </div>

    <div class="panel settings-panel" id="settings-panel">
      <h3 class="settings-title">Game mode</h3>
      <div class="mode-cards" id="mode-cards">
        <button type="button" class="mode-card" data-mode="classic">
          <span class="mode-name">Classic</span>
          <span class="mode-desc">First player to reach the target score <b>loses</b>.</span>
        </button>
        <button type="button" class="mode-card" data-mode="exact">
          <span class="mode-name">Exact Target</span>
          <span class="mode-desc">Land on the target <b>exactly</b> to win. Go over it and you lose.</span>
        </button>
      </div>

      <label class="target-label" for="target-input">Target score
        <input id="target-input" type="number" inputmode="numeric" min="10" max="500" step="5" />
      </label>
      <div class="target-presets" id="target-presets"></div>

      <p id="mode-summary" class="mode-summary"></p>
      <p id="settings-note" class="hint"></p>
    </div>

    <div id="lobby-h2h" class="h2h-lobby hidden"></div>

    <button id="btn-start-game" class="primary start-btn" disabled>Start Game</button>
    <p id="start-hint" class="hint"></p>
  </section>

  <!-- GAME -->
  <section id="screen-game" class="screen hidden">

    <header class="game-header">
      <div class="score-box" id="opp-score-box">
        <div class="score-name" id="opp-name">Opponent</div>
        <div class="score-h2h hidden" id="opp-h2h"></div>
        <div class="score-value" id="opp-score">0</div>
        <div class="conn-status" id="opp-conn-status">Disconnected</div>
      </div>
      <div class="match-target" id="match-target-box">
        <span class="mt-label" id="mt-label-1">First to</span>
        <span class="mt-num" id="match-target-val">100</span>
        <span class="mt-label" id="mt-label-2">loses</span>
      </div>
      <div class="score-box" id="my-score-box">
        <div class="score-name" id="my-name">You</div>
        <div class="score-h2h hidden" id="my-h2h"></div>
        <div class="score-value" id="my-score">0</div>
      </div>
    </header>

    <div class="turn-banner" id="turn-banner">
      <div class="turn-indicator" id="turn-indicator"></div>
    </div>

    <div class="opponent-row">
      <div class="opp-cards" id="opp-card-backs"></div>
    </div>

    <div class="table-row">
      <div class="pile-block">
        <div id="draw-pile" class="card card-back" title="Draw a card"></div>
      </div>
      <div class="pile-block">
        <div id="discard-pile" class="discard-group"></div>
      </div>
    </div>

    <div class="hand-header">
      <button id="btn-takeback" type="button" class="takeback invisible" tabindex="-1">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M6 3.5L2.5 7 6 10.5M2.5 7H10a3.5 3.5 0 0 1 0 7H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Take back</span>
      </button>
      <button id="btn-sort" class="sort-toggle" type="button" title="Auto-arrange" aria-label="Auto-arrange" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M1.5 5.5h12M13.5 5.5L11 3M13.5 5.5L11 8M14.5 10.5h-12M2.5 10.5L5 8M2.5 10.5L5 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Auto</span>
      </button>
    </div>

    <div class="hand-row" id="my-hand"></div>

    <div class="action-row">
      <button id="btn-discard" class="primary" disabled>Discard Selected</button>
      <button id="btn-faceoff" class="danger" disabled>Call Face&nbsp;Off</button>
      <div id="my-total" class="my-total"></div>
    </div>

  </section>

  <!-- DRAW PICKUP DISPLAY (your own draw, held for a beat before settling into your hand) -->
  <div id="overlay-pickup" class="overlay-pickup hidden">
    <div class="pickup-label" id="pickup-label">You drew</div>
    <div class="pickup-card-slot" id="pickup-card-slot"></div>
  </div>

  <!-- OPPONENT DRAW NOTICE -->
  <p id="draw-toast" class="draw-toast hidden"></p>

  <!-- FACE OFF COUNTDOWN OVERLAY -->
  <div id="overlay-countdown" class="overlay overlay-countdown hidden">
    <div class="countdown-heart">&hearts;</div>
    <div class="countdown-num" id="countdown-num">3</div>
    <div class="countdown-label">Face&nbsp;Off!</div>
  </div>

  <!-- EXACT-TARGET CELEBRATION -->
  <div id="overlay-celebrate" class="overlay overlay-celebrate hidden">
    <canvas id="confetti-canvas"></canvas>
    <div class="celebrate-content" id="celebrate-content">
      <div class="celebrate-kicker" id="celebrate-kicker">PERFECT SCORE</div>
      <div class="celebrate-number" id="celebrate-number">50</div>
      <div class="celebrate-title" id="celebrate-title">EXACTLY!</div>
      <div class="celebrate-sub" id="celebrate-sub"></div>
      <button id="btn-celebrate-continue" class="primary">Continue</button>
    </div>
  </div>

  <!-- DRAMATIC REVEAL OVERLAY (hand over or match over) -->
  <div id="overlay-reveal" class="overlay overlay-reveal hidden">
    <div class="overlay-box reveal-box">
      <h2 id="reveal-title">Face Off!</h2>

      <div class="reveal-hands">
        <div class="reveal-side">
          <div class="reveal-side-name" id="reveal-my-name">You</div>
          <div class="reveal-cards" id="reveal-my-cards"></div>
          <div class="reveal-total" id="reveal-my-total">0 pts</div>
        </div>
        <div class="reveal-vs">VS</div>
        <div class="reveal-side">
          <div class="reveal-side-name" id="reveal-opp-name">Opponent</div>
          <div class="reveal-cards" id="reveal-opp-cards"></div>
          <div class="reveal-total" id="reveal-opp-total">0 pts</div>
        </div>
      </div>

      <div id="reveal-detail" class="overlay-detail"></div>

      <div id="reveal-matchover-detail" class="overlay-detail hidden"></div>

      <button id="btn-next-hand" class="primary">Next Hand</button>
      <button id="btn-new-match" class="primary hidden">New Match</button>
    </div>
  </div>

  <p id="game-error" class="error toast hidden"></p>
</div>

<script src="client.js"></script>
</body>
</html>
